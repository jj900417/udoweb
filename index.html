<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      검색엔진 소유권 확인. 아래 head 마커 **바깥**에 둬야 해요 — 마커 안쪽은
      prerender 가 페이지별 머리말로 통째로 갈아끼워요.
    -->
    <meta name="google-site-verification" content="hIZGkGd1ubmjHomMO_c8arQwxsx58z8IEoghLpba0Xo" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- head:start — prerender 가 이 구간을 페이지별 제목·설명으로 바꿔요.
         마커를 지우거나 이름을 바꾸면 모든 페이지가 홈의 머리말을 달고 나가요. -->
    <title>우도 — 기록과 지금</title>
    <meta
      name="description"
      content="우도의 역사·사람·풍경을 기록하고, 오늘의 여행 정보를 함께 제공하는 우도 정보 플랫폼."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="우도 — 기록과 지금" />
    <meta
      property="og:description"
      content="사라질 것을 알기에, 사라지기 전에 기록합니다. 우도의 기록·역사·목소리, 그리고 지금의 우도."
    />
    <meta property="og:image" content="https://udonow.co.kr/og.png" />
    <meta property="og:url" content="https://udonow.co.kr" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- head:end -->
    <script>
      /* Theme applied before first paint (no flash). Mirrors src/theme.tsx. */
      (function () {
        try {
          var saved = localStorage.getItem('udoweb-theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
