<!doctype html>
<!--
  public/og.png 의 원본.

  카톡·페이스북·트위터로 공유될 때 뜨는 카드 이미지예요.

  사진이 주인공이고 글자는 아래쪽에만 얹어요 — 하늘과 실루엣을 가리지 않으려고요.
  scrim(어두운 그라데이션)은 아래 절반에만 걸어서 글자만 읽히게 해요.

  다시 만들려면: 원본 사진 경로를 `.photo` 의 `background-image` 에 맞춘 뒤
  브라우저를 **1200×630** 으로 열어 스크린샷을 찍어 public/og.png 로 저장해요.
  (deviceScaleFactor 1)

  ⚠️ 사진의 권리는 확인하고 쓸 것. 남의 사진을 공유 카드에 쓰면 사이트 전체가
  같이 문제가 돼요.
  ⚠️ 이미 공유된 링크는 캐시 때문에 바로 안 바뀌어요. 페이스북은 Sharing Debugger
  에서 갱신할 수 있지만 카카오톡은 갱신 도구가 없어요 — 초기에 확정하는 게 좋아요.
-->
<html lang="ko"><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #fff; background: #0a1420;
  }
  .photo {
    position: absolute; inset: 0;
    background-image: url('./og-source.png');
    background-size: cover; background-position: center 42%;
  }
  /* 아래쪽만 살짝 어둡게 — 사진을 덮지 않고 글자만 읽히게 해요. */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(4, 10, 18, .78) 0%, rgba(4, 10, 18, .35) 26%, rgba(4, 10, 18, 0) 52%);
  }
  .content { position: absolute; left: 72px; bottom: 66px; }
  .name {
    font-size: 96px; font-weight: 800; letter-spacing: -.03em; line-height: 1;
    text-shadow: 0 2px 28px rgba(0, 0, 0, .55);
  }
  .tagline {
    margin-top: 18px; font-size: 32px; font-weight: 500; letter-spacing: -.01em;
    opacity: .94; text-shadow: 0 2px 16px rgba(0, 0, 0, .6);
  }
  .domain {
    position: absolute; right: 72px; bottom: 74px;
    font-size: 24px; font-weight: 600; letter-spacing: .08em; opacity: .8;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .7);
  }
</style></head><body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="content">
    <div class="name">우도</div>
    <div class="tagline">제주 바다 위의 작은 섬 — 기록과 지금</div>
  </div>
  <div class="domain">UDONOW.CO.KR</div>
</body></html>
