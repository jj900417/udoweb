<!doctype html>
<!--
  public/og.png 의 원본.

  카톡·페이스북·트위터로 공유될 때 뜨는 카드 이미지예요. 사진이 아니라 표식이라
  정직해요 — 우리가 찍지 않은 우도 사진을 쓰거나, 없는 장면을 만들어 넣지 않아요.
  파비콘과 같은 시각 언어(해·수평선)와 브랜드 시안(--color-brand)을 씁니다.

  문안이 바뀌면 다시 만들어요. 브라우저를 1200×630 으로 열어 이 파일을 띄우고
  스크린샷을 찍어 public/og.png 로 저장하면 돼요. 헤드리스로도 같아요:

    (viewport 1200×630, deviceScaleFactor 1) → screenshot → public/og.png

  ⚠️ 실제 우도 사진이 생기면 그걸로 바꾸는 편이 좋아요. 공유될 때 첫인상이라
  진짜 섬 사진을 이길 수는 없어요.
-->
<html lang="ko"><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    /* 브랜드 시안(--color-brand #00a5cd)에서 깊은 바다 쪽으로. */
    background: linear-gradient(170deg, #0a4d63 0%, #00a5cd 55%, #4cc9e8 100%);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #fff;
  }
  /* 파비콘과 같은 시각 언어 — 해와 수평선. 사진이 아니라 표식이라 정직해요. */
  .sun {
    position: absolute; right: 148px; top: 128px;
    width: 132px; height: 132px; border-radius: 50%;
    background: #ffd166; box-shadow: 0 0 90px 30px rgba(255, 209, 102, .28);
  }
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; }
  .content { position: absolute; left: 96px; top: 188px; }
  .name {
    font-size: 132px; font-weight: 800; letter-spacing: -.03em; line-height: 1;
    text-shadow: 0 3px 24px rgba(0, 40, 55, .3);
  }
  .tagline { margin-top: 26px; font-size: 40px; font-weight: 500; opacity: .95; letter-spacing: -.01em; }
  .domain {
    position: absolute; left: 96px; bottom: 64px;
    font-size: 27px; font-weight: 600; letter-spacing: .06em; opacity: .82;
  }
</style></head><body>
  <div class="sun"></div>
  <svg class="waves" viewBox="0 0 1200 250" preserveAspectRatio="none">
    <path d="M0 150c100 0 100-40 200-40s100 40 200 40 100-40 200-40 100 40 200 40 100-40 200-40 100 40 200 40v110H0z" fill="#ffffff" opacity=".13"/>
    <path d="M0 190c100 0 100-36 200-36s100 36 200 36 100-36 200-36 100 36 200 36 100-36 200-36 100 36 200 36v70H0z" fill="#ffffff" opacity=".2"/>
  </svg>
  <div class="content">
    <div class="name">우도</div>
    <div class="tagline">제주 바다 위의 작은 섬 — 기록과 지금</div>
  </div>
  <div class="domain">UDONOW.CO.KR</div>
</body></html>
